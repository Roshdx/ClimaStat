version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - climastat-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:${POSTGRES_PORT:-5432}/postgres}
      DB_SSL: ${DB_SSL:-false}
      PORT: ${BACKEND_PORT:-4000}
      NODE_ENV: development
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/usr/src/app:rw
      - /usr/src/app/node_modules
    command: ["nodemon", "--config", "nodemon.json", "index.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:${BACKEND_PORT:-4000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - climastat-net

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: climastat-frontend-dev:local
    ports:
      - "5173:5173"            # vite dev server
    environment:
      - VITE_API_BASE=http://localhost:4000
    volumes:
      - ./frontend:/app:rw     # mount code for instant reload
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - climastat-net

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db
    networks:
      - climastat-net

volumes:
  pgdata_dev:

networks:
  climastat-net:
    driver: bridge
